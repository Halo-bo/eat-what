<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>吃点啥 · 美食大富翁</title>
    <link rel="stylesheet" href="./style.css?v=expanded-panels" />
  </head>
  <body>
    <main class="game-shell">
      <section class="stage">
        <header class="brand">
          <p>今日饭运局</p>
          <h1 class="brand-logo">
            <img src="./assets/brand/eat-what-logo.png?v=sweet-logo" alt="EAT-WHAT" />
          </h1>
        </header>

        <section class="board-wrap" aria-label="美食棋盘">
          <div class="board" id="board"></div>
          <section class="center-stage" aria-label="角色状态和美食详情">
            <div class="center-scene">
              <div class="character corgi large sitting" id="centerCharacter" aria-hidden="true">
                <img class="character-photo corgi-photo" src="./assets/characters/corgi.png?v=character-avatars" alt="" />
                <img class="character-photo bluecat-photo" src="./assets/characters/bluecat.png?v=character-avatars" alt="" />
                <span class="ear left"></span>
                <span class="ear right"></span>
                <span class="face"></span>
                <span class="snout"></span>
                <span class="body"></span>
                <span class="belly"></span>
                <span class="leg left"></span>
                <span class="leg right"></span>
                <span class="tail"></span>
              </div>
              <div class="food-photo" id="foodPhoto">
                <img id="foodImage" alt="" />
                <span id="foodEmoji">🍽️</span>
              </div>
            </div>
            <div class="center-copy">
              <p id="characterMood">胖柯基正在乖乖坐着等开饭</p>
              <strong id="centerFoodName">转盘后揭晓</strong>
            </div>
          </section>
          <div class="spinner-pad" aria-label="转盘投掷区" onclick="requestRoll(event)" onpointerup="requestRoll(event)">
            <img class="spinner-hint" src="./assets/ui/click-sign.png?v=spinner-hint" alt="" />
            <button class="board-spinner unknown" id="boardDice" type="button" aria-label="在棋盘右下角转动指针" onclick="requestRoll(event)"></button>
          </div>
          <div class="character corgi small mascot sitting" id="mascot" aria-label="行走中的角色">
            <img class="character-photo corgi-photo" src="./assets/characters/corgi.png?v=character-avatars" alt="" />
            <img class="character-photo bluecat-photo" src="./assets/characters/bluecat.png?v=character-avatars" alt="" />
            <span class="ear left"></span>
            <span class="ear right"></span>
            <span class="face"></span>
            <span class="snout"></span>
            <span class="body"></span>
            <span class="belly"></span>
            <span class="leg left"></span>
            <span class="leg right"></span>
            <span class="tail"></span>
          </div>
        </section>
      </section>

      <aside class="control-panel">
        <section class="oracle">
          <div>
            <p class="kicker">饭运已经开始发癫</p>
            <h2 id="resultTitle">先转一把</h2>
            <p id="resultText">棋盘已开机。选一个饭搭子，戳一下转盘，让命运端着饭碗冲过来。</p>
          </div>
        </section>

        <section class="signals" aria-label="今日信号">
          <div class="signal-card signal-weather">
            <span>天气</span>
            <strong id="weatherText">读取中</strong>
          </div>
          <div class="signal-card signal-fortune">
            <span>运势</span>
            <strong id="fortuneText">开局待定</strong>
          </div>
          <div class="signal-card signal-mystic">
            <span>玄学</span>
            <strong id="mysticText">锅气正在打鸣</strong>
          </div>
        </section>

        <section class="characters" aria-label="角色选择">
          <div class="section-head">
            <h2>选择饭搭子</h2>
            <span id="characterName">胖柯基</span>
          </div>
          <div class="character-options" id="characterOptions">
            <button class="character-option active" data-character="corgi">
              <img class="character-choice-avatar" src="./assets/characters/corgi.png?v=character-avatars" alt="" />
              胖柯基
            </button>
            <button class="character-option" data-character="bluecat">
              <img class="character-choice-avatar" src="./assets/characters/bluecat.png?v=character-avatars" alt="" />
              蓝猫
            </button>
          </div>
        </section>

        <div class="actions">
          <button class="primary" id="rollBtn" type="button" onclick="requestRoll(event)">开摇！</button>
          <button class="secondary" id="shuffleBtn" type="button">重洗饭运</button>
        </div>
      </aside>
    </main>

    <script src="./app.js?v=expanded-panels"></script>
  </body>
</html>
